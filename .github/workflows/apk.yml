name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Zip dosyasini ac
        run: |
          # Depoda birden fazla zip varsa EN SON YUKLENENI kullan (dosya adi ne olursa olsun)
          ZIP=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Kullanilan zip (en son yuklenen): $ZIP"
          unzip -o -q "$ZIP" -d proje
          DIZIN=$(dirname "$(find proje -name settings.gradle | head -1)")
          echo "PROJE=$DIZIN" >> $GITHUB_ENV

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK olustur
        run: |
          cd "$PROJE"
          gradle assembleDebug --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/cikti"
          # Projede kac uygulama varsa hepsini anlasilir adlarla kopyala
          for f in $(find app/build/outputs/apk -name '*.apk'); do
            case "$f" in
              */isg/*) AD=ISG_2026.apk ;;
              */gys/*) AD=YOK_GYS_2026.apk ;;
              *)       AD=Duzce_Risk_Degerlendirme.apk ;;
            esac
            cp "$f" "$GITHUB_WORKSPACE/cikti/$AD"
            echo "Hazir: $AD"
          done
          ls -la "$GITHUB_WORKSPACE/cikti"

      - name: APK'yi Actions sayfasina koy
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: cikti/*.apk

      - name: APK'yi Releases sayfasina koy (dogrudan indirme)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: cikti/*.apk
